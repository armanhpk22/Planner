<title>برنامه‌ی من</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#ECEFEA;--surface:#FFFFFF;--ink:#15201E;--muted:#6B7975;--line:#E0E5DF;--pine:#15705A;--amber:#BC7A12;}
html,body{background:var(--bg);}
body{font-family:'Vazirmatn','Tahoma','Segoe UI',sans-serif;color:var(--ink);min-height:100vh;}
.app{max-width:520px;margin:0 auto;position:relative;min-height:100vh;}
.scroll{padding:20px 18px 96px;animation:fade .28s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page{display:flex;flex-direction:column;gap:14px;}
.head{display:flex;justify-content:space-between;align-items:flex-start;}
.greet{font-size:23px;font-weight:900;letter-spacing:-.4px;}
.sub{color:var(--muted);font-size:13.5px;margin-top:3px;}
.clock{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:999px;}
.clock svg{width:15px;height:15px;}
.nowcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden;box-shadow:0 6px 22px rgba(20,40,35,.06);}
.nowcard::before{content:"";position:absolute;top:0;bottom:0;right:0;width:6px;background:var(--accent);border-radius:6px 0 0 6px;}
.nowtop{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(0,0,0,.06);animation:breathe 2.6s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6}}
.nowlabel{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.3px;}
.nowtitle{font-size:21px;font-weight:800;line-height:1.4;letter-spacing:-.3px;}
.nownote{color:var(--muted);font-size:13.5px;line-height:1.85;margin-top:7px;}
.nowtime{display:inline-block;margin-top:11px;font-size:12.5px;font-weight:600;background:var(--bg);padding:5px 11px;border-radius:999px;}
.next{font-size:13px;color:var(--muted);padding:0 4px;}
.next b{color:var(--ink);font-weight:700;}
.focusrow{display:flex;align-items:center;gap:10px;background:#EAF2EE;border:1px solid #CDE3DA;border-radius:16px;padding:12px 14px;}
.fkr{font-size:11.5px;font-weight:700;color:var(--pine);white-space:nowrap;}
.fkt{font-size:14px;font-weight:600;}
.secttl{font-size:13px;font-weight:800;margin:6px 4px -2px;letter-spacing:-.2px;}
.secttl.muted{color:var(--muted);font-weight:700;margin-top:14px;}
.timeline{display:flex;flex-direction:column;gap:8px;}
.tl{display:flex;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:12px 13px;}
.tl.tlon{box-shadow:0 4px 16px rgba(20,40,35,.08);}
.tlbar{width:4px;align-self:stretch;border-radius:4px;background:var(--accent);flex:0 0 auto;opacity:.85;}
.tlbody{flex:1;min-width:0;}
.tlhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.tllabel{font-size:15px;font-weight:700;}
.tltime{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;}
.tlnote{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:4px;}
.ph h1{font-size:24px;font-weight:900;letter-spacing:-.5px;}
.ph p{color:var(--muted);font-size:13px;line-height:1.8;margin-top:4px;}
.addrow{display:flex;gap:8px;}
.inp{flex:1;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;outline:none;}
.inp:focus{border-color:var(--pine);}
.addbtn{flex:0 0 auto;width:48px;border:none;background:var(--pine);color:#fff;border-radius:13px;display:grid;place-items:center;cursor:pointer;}
.addbtn:active{transform:scale(.95);}
.addbtn svg{width:20px;height:20px;}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;}
.task.done .ttext{color:var(--muted);text-decoration:line-through;}
.cbox{flex:0 0 auto;width:23px;height:23px;border-radius:8px;border:2px solid #C4CCC8;background:transparent;cursor:pointer;display:grid;place-items:center;color:#fff;}
.cbox.on{background:var(--pine);border-color:var(--pine);}
.cbox svg{width:14px;height:14px;}
.ttext{flex:1;font-size:15px;line-height:1.6;}
.del{flex:0 0 auto;background:none;border:none;color:#B9C1BD;cursor:pointer;padding:4px;display:grid;place-items:center;}
.del:active{color:#A8472F;}
.del svg{width:17px;height:17px;}
.wide{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--pine);border:1.5px dashed #9DC3B6;border-radius:14px;padding:14px;text-decoration:none;}
.wide:active{transform:scale(.99);}
.wide svg{width:18px;height:18px;}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.area{font-family:inherit;font-size:14.5px;line-height:1.9;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;resize:vertical;}
.area:focus{border-color:var(--pine);}
.erow{display:flex;gap:8px;justify-content:flex-end;}
.ghost{font-family:inherit;font-size:14px;font-weight:600;background:none;border:none;color:var(--muted);padding:9px 14px;cursor:pointer;}
.solid{font-family:inherit;font-size:14px;font-weight:700;background:var(--pine);color:#fff;border:none;border-radius:11px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;}
.solid svg{width:17px;height:17px;}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;}
.nhead{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ntitle{font-size:16px;font-weight:800;}
.ndate{font-size:11.5px;color:var(--muted);margin-top:2px;}
.nbody{font-size:14px;line-height:1.95;margin-top:9px;white-space:pre-wrap;}
.file{width:100%;display:flex;align-items:center;gap:12px;text-align:right;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-family:inherit;}
.ficon{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:var(--bg);display:grid;place-items:center;color:var(--pine);}
.ficon svg{width:18px;height:18px;}
.fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.fname{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fsub{font-size:11.5px;color:var(--muted);}
.warn{font-size:13px;color:#A8472F;background:#FBEDE9;border:1px solid #F1D6CE;border-radius:12px;padding:11px 13px;}
.modal{position:fixed;inset:0;background:rgba(18,28,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s ease;}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px 26px;display:flex;flex-direction:column;gap:12px;max-height:85vh;}
.mhead{display:flex;align-items:center;gap:10px;}
.mclose{background:var(--bg);border:none;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink);}
.mclose svg{width:20px;height:20px;}
.mtitle{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mimg{width:100%;border-radius:14px;object-fit:contain;max-height:60vh;background:var(--bg);}
.mph{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);padding:34px;background:var(--bg);border-radius:14px;}
.mph svg{width:40px;height:40px;}
.loading,.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px;}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;}
.bksec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
.bknote{color:var(--muted);font-size:12.5px;line-height:1.8;margin-bottom:2px;}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:8px 6px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:40;}
.tab{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;color:var(--muted);}
.tab svg{width:21px;height:21px;}
.tab span{font-size:11px;font-weight:600;}
.tab.on{color:var(--pine);}
.tab.on span{font-weight:800;}
.tab:active{transform:scale(.94);}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 10px;}
.stat{text-align:center;}
.stat b{display:block;font-size:18px;font-weight:900;letter-spacing:-.3px;}
.stat span{font-size:10px;color:var(--muted);}
.stat.good b{color:var(--pine);}
.stat.bad b{color:#A8472F;}
.jform{display:flex;flex-direction:column;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;}
.fld{display:flex;flex-direction:column;gap:7px;}
.flbl{font-size:12.5px;font-weight:700;color:var(--muted);}
.jdiv{font-size:12.5px;font-weight:800;color:var(--pine);margin-top:6px;padding-top:12px;border-top:1px dashed var(--line);}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);border:1.5px solid transparent;border-radius:11px;padding:8px 13px;cursor:pointer;}
.chip.on{background:#EAF2EE;border-color:var(--pine);color:var(--pine);}
.chip.dir-up.on{background:#E7F1EB;border-color:#15705A;color:#15705A;}
.chip.dir-dn.on{background:#FBEDE9;border-color:#A8472F;color:#A8472F;}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.minp{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 8px;outline:none;width:100%;text-align:center;}
.minp:focus{border-color:var(--pine);background:var(--surface);}
.stars{display:flex;gap:5px;}
.star{width:30px;height:30px;color:#D4DAD6;cursor:pointer;background:none;border:none;padding:0;}
.star.on{color:var(--amber);}
.star svg{width:100%;height:100%;}
.thumbbtn{display:flex;align-items:center;gap:10px;}
.thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;border:1px solid var(--line);flex:0 0 auto;}
.trade{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px;}
.trade.win{border-right:4px solid #15705A;}
.trade.loss{border-right:4px solid #A8472F;}
.trade.be{border-right:4px solid #7C8B87;}
.thead{display:flex;align-items:center;gap:8px;}
.tsym{font-size:16px;font-weight:900;letter-spacing:.3px;}
.tdir{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;}
.tdir.up{background:#E7F1EB;color:#15705A;}
.tdir.dn{background:#FBEDE9;color:#A8472F;}
.tout{font-size:12px;font-weight:800;margin-right:auto;}
.tout.win{color:#15705A;}
.tout.loss{color:#A8472F;}
.tout.be{color:#7C8B87;}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;}
.tg{font-size:11px;color:var(--muted);background:var(--bg);padding:3px 9px;border-radius:8px;}
.tnums{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink);}
.tnums b{font-weight:800;}
.tlesson{font-size:13px;line-height:1.85;background:var(--bg);border-radius:10px;padding:9px 11px;}
.tdate{font-size:11px;color:var(--muted);}
.tphoto{width:100%;border-radius:12px;cursor:pointer;}
.pwrap{display:flex;align-items:center;gap:10px;}
.pbar{flex:1;height:8px;background:var(--bg);border-radius:999px;overflow:hidden;}
.pfill{height:100%;background:var(--pine);border-radius:999px;transition:width .25s;}
.pnum{font-size:11.5px;font-weight:800;color:var(--pine);white-space:nowrap;}
.citem{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);}
.clabel{flex:1;font-size:14px;line-height:1.55;}
.creq{font-size:9.5px;font-weight:800;color:#A8472F;background:#FBEDE9;padding:2px 7px;border-radius:6px;white-space:nowrap;}
.copt{font-size:9.5px;font-weight:700;color:var(--muted);background:var(--bg);padding:2px 7px;border-radius:6px;white-space:nowrap;}
.cselrow{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-bottom:1px solid var(--line);}
.cseltop{display:flex;align-items:center;gap:7px;}
.csellbl{font-size:13px;font-weight:700;color:var(--muted);}
.solid.off{background:#CBD3CF;cursor:default;}
.tpend{font-size:11px;font-weight:800;color:var(--amber);margin-right:auto;}
.trade.pend{border-right:4px solid var(--amber);}
.chkline{font-size:11px;color:var(--pine);font-weight:700;margin-top:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

function todayBlocks(day){

function findNow(bs,m){var ins=bs.filter(function(x){return m>=toMin(x.s)&&m<toMin(x.e);});if(!ins.length)return null;ins.sort(function(a,b){return (toMin(a.e)-toMin(a.s))-(toMin(b.e)-toMin(b.s));});return ins[0];}

function chkTags(chk){
  if(!chk)return [];
  var skip={dir:1,pd:1,bos:1,hunt_prev:1,hunt_liq:1,gap_daily:1,gap_hourly:1};
  var out=[];
  CHK.forEach(function(g){g.items.forEach(function(it){
    if(skip[it.k])return;
    var v=chk[it.k];
    if(it.type==='check'){if(v===true)out.push(it.label);}
    else if(v){var o=(it.opts||[]).filter(function(x){return x[0]===v;})[0];out.push(it.label+': '+(o?o[1]:v));}
  });});
  return out;
}
function jStats(){
  var w=0,l=0,n=0,netR=0,dsum=0,dn=0;
  S.trades.forEach(function(t){
    if(t.status==='pending')return;
    n++;
    if(t.outcome==='win')w++;else if(t.outcome==='loss')l++;
    var r=parseFloat(t.r);if(!isNaN(r))netR+=r;
    var d=+t.discipline;if(d>0){dsum+=d;dn++;}
  });
  var decided=w+l;
  return {n:n,wr:decided?Math.round(w/decided*100):0,netR:Math.round(netR*100)/100,avgD:dn?(dsum/dn).toFixed(1):'-'};
}

  h+='<div class="erow"><button class="ghost" data-act="canceltrade">بی‌خیال</button><button class="solid" data-act="savetrade">ذخیره‌ی معامله</button></div>';
  return h+'</div>';
}
function tradeCard(t){
  var pend=t.status==='pending';
  var ocl=pend?'pend':(t.outcome==='win'?'win':t.outcome==='loss'?'loss':'be');
  var ocL=t.outcome==='win'?'برد':t.outcome==='loss'?'باخت':t.outcome==='be'?'سربه‌سر':'';
  var dirL=t.dir==='up'?'صعودی':t.dir==='dn'?'نزولی':'';
  var su=Array.isArray(t.setup)?t.setup:(t.setup?[t.setup]:[]);
  var form=[isoFa(t.setupdate),t.setuptime?('ساعت '+toFa(t.setuptime)):''].filter(Boolean).join(' ');
  var tags=su.map(function(s){return SETL[s]||s;}).concat([t.setupother?('سایر: '+t.setupother):'',PDL[t.pd],form?('تشکیل: '+form):'',SESL[t.session],PLNL[t.plan],EMOL[t.emotion]]).filter(Boolean);
  var nums=[];
  if(t.risk!==''&&t.risk!=null)nums.push('<span>ریسک: <b>'+esc(t.risk)+'٪</b></span>');
  if(t.r!==''&&t.r!=null)nums.push('<span>R: <b>'+esc(t.r)+'</b></span>');
  if(t.pct!==''&&t.pct!=null)nums.push('<span>نتیجه: <b>'+esc(t.pct)+'٪</b></span>');
  if(t.pips!==''&&t.pips!=null)nums.push('<span>پیپ: <b>'+esc(t.pips)+'</b></span>');
  if(t.amount!==''&&t.amount!=null)nums.push('<span>مبلغ: <b>'+esc(t.amount)+'</b></span>');
  if(t.balance!==''&&t.balance!=null)nums.push('<span>بالانس: <b>'+esc(t.balance)+'</b></span>');
  var h='<div class="trade '+ocl+'">';
  h+='<div class="thead"><span class="tsym">'+esc(t.symbol||'بدون نماد')+'</span>'+(dirL?'<span class="tdir '+(t.dir==='up'?'up':'dn')+'">'+dirL+'</span>':'')+(pend?'<span class="tpend">در انتظار تکمیل</span>':'<span class="tout '+ocl+'">'+ocL+'</span>')+'</div>';
  if(tags.length)h+='<div class="tmeta">'+tags.map(function(x){return '<span class="tg">'+esc(x)+'</span>';}).join('')+'</div>';
  if(nums.length)h+='<div class="tnums">'+nums.join('')+'</div>';
  if(!pend&&+t.discipline>0){var ds='';for(var i=1;i<=5;i++){ds+='<span class="star'+(t.discipline>=i?' on':'')+'" style="width:15px;height:15px">'+I.star+'</span>';}h+='<div class="stars" style="gap:3px">'+ds+'</div>';}
  if(t.mistake&&t.mistake!=='none')h+='<div class="tg" style="align-self:flex-start;color:#A8472F;background:#FBEDE9">'+esc(MISL[t.mistake])+'</div>';
  if(t.lesson)h+='<div class="tlesson">'+esc(t.lesson)+'</div>';
  if(t.note)h+='<div class="tdate" style="font-size:12.5px">'+esc(t.note)+'</div>';
  var ct=chkTags(t.chk);
  if(ct.length){h+='<div class="chkline">چک‌لیستِ ورود ✓</div><div class="tmeta">'+ct.map(function(x){return '<span class="tg">'+esc(x)+'</span>';}).join('')+'</div>';}
  if(t.hasImg){var im=localStorage.getItem('planner_trade_img_'+t.id);if(im)h+='<img class="tphoto" data-act="opentradeimg" data-id="'+t.id+'" src="'+im+'">';}
  h+='<div class="thead" style="margin-top:2px"><span class="tdate" style="flex:1">'+esc(t.date)+'</span>';
  if(pend)h+='<button class="solid" style="padding:7px 14px;font-size:13px" data-act="completetrade" data-id="'+t.id+'">تکمیل</button>';
  else h+='<button class="ghost" style="padding:6px 10px;font-size:12.5px" data-act="completetrade" data-id="'+t.id+'">ویرایش</button>';
  h+='<button class="del" data-act="deltrade" data-id="'+t.id+'">'+I.trash+'</button></div>';
  return h+'</div>';
}
function viewJournal(){
  var st=jStats();
  var h='<div class="page"><div class="ph"><h1>ژورنالِ ترید</h1><p>هر معامله رو کامل ثبت کن — فنی و روانی. خلاصه‌ش بالا میاد.</p></div>';
  h+='<div class="stats"><div class="stat"><b>'+toFa(st.n)+'</b><span>معامله</span></div>';
  h+='<div class="stat '+(st.n?(st.wr>=50?'good':'bad'):'')+'"><b>'+toFa(st.wr)+'٪</b><span>وین‌ریت</span></div>';
  h+='<div class="stat '+(st.netR>=0?'good':'bad')+'"><b>'+(st.netR>0?'+':'')+toFa(st.netR)+'</b><span>مجموع R</span></div>';
  h+='<div class="stat"><b>'+toFa(st.avgD)+'</b><span>نظم (۵)</span></div></div>';
  if(S.chkOpen){h+=viewChecklist();}
  else if(S.jed){h+=journalForm();}
  else{
    h+='<button class="wide" data-act="openchk">'+I.plus+' ثبتِ معامله‌ی جدید (چک‌لیست)</button>';
    if(!S.trades.length)h+='<div class="empty">هنوز معامله‌ای ثبت نکردی.</div>';
    S.trades.forEach(function(t){h+=tradeCard(t);});
  }
  return h+'</div>';
}
function prettySize(b){if(b<1024)return toFa(b)+' بایت';if(b<1048576)return toFa(Math.round(b/1024))+' کیلوبایت';return toFa((b/1048576).toFixed(1))+' مگابایت';}
function viewFiles(){
  var h='<div class="page"><div class="ph"><h1>فایل‌ها</h1><p>گزارش، عکس، یا هر فایلی که به این پروژه ربط داره. تا ۳ مگابایت.</p></div>';
  h+='<button class="wide" data-act="pick">'+I.upload+' آپلودِ فایل</button><input type="file" id="fileinput" style="display:none">';
  if(S.fmsg)h+='<div class="warn">'+esc(S.fmsg)+'</div>';
  if(!S.files.length)h+='<div class="empty">هنوز فایلی نذاشتی.</div>';
  S.files.forEach(function(f){h+='<button class="file" data-act="openfile" data-id="'+f.id+'"><span class="ficon">'+I.file+'</span><span class="fmeta"><span class="fname">'+esc(f.name)+'</span><span class="fsub">'+prettySize(f.size)+' · '+esc(f.date)+'</span></span><span class="del" data-act="delfile" data-id="'+f.id+'">'+I.trash+'</span></button>';});
  h+='<div class="bksec"><div class="secttl">بکاپ و انتقال داده</div><p class="bknote">یه فایلِ بکاپ از کارها، یادداشت‌ها و فایل‌هات می‌گیری — هم برای خودت نگه می‌داری، هم اگه خواستی همینو برام بفرستی تا داده‌هاتو ببینم.</p>';
  h+='<button class="wide" data-act="export">'+I.download+' گرفتن بکاپ</button>';
  h+='<button class="wide" data-act="pickimport">'+I.upload+' بازیابی از بکاپ</button>';
  h+='<input type="file" id="importinput" accept="application/json,.json" style="display:none"></div>';
  h+='</div>';return h;
}

/* ---------- render ---------- */
function render(){
  var v=document.getElementById('view');
  v.innerHTML = S.tab==='today'?viewToday():S.tab==='tasks'?viewTasks():S.tab==='notes'?viewNotes():S.tab==='journal'?viewJournal():viewFiles();
  var fi=document.getElementById('fileinput');
  if(fi)fi.addEventListener('change',onPick);
  var ii=document.getElementById('importinput');
  if(ii)ii.addEventListener('change',importData);
  var ti=document.getElementById('tradeimginput');
  if(ti)ti.addEventListener('change',onTradeImg);
  renderNav();
}
function renderNav(){
  var tabs=[['today','امروز',I.calendar],['tasks','کارها',I.list],['notes','یادداشت',I.note],['journal','ژورنال',I.chart],['files','فایل‌ها',I.clip]];
  document.getElementById('nav').innerHTML=tabs.map(function(t){return '<button class="tab'+(S.tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[2]+'<span>'+t[1]+'</span></button>';}).join('');
}

/* ---------- actions ---------- */
function onPick(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>3145728){S.fmsg='فایل بزرگ‌تر از ۳ مگابایته. یه فایل کوچک‌تر بذار.';render();return;}
  S.fmsg='';var r=new FileReader();
  r.onload=function(){var id=uid();try{localStorage.setItem('planner_file_'+id,r.result);}catch(err){S.fmsg='حافظه پر شد. یه فایل پاک کن و دوباره امتحان کن.';render();return;}
    S.files.unshift({id:id,name:f.name,type:f.type,size:f.size,date:faDate({day:'numeric',month:'long'})});save('planner_files',S.files);render();};
  r.readAsDataURL(f);
}
function openFile(id){
  var meta=S.files.filter(function(x){return x.id===id;})[0];if(!meta)return;
  var data=localStorage.getItem('planner_file_'+id);if(!data)return;
  var isImg=meta.type&&meta.type.indexOf('image/')===0;
  var ov=document.createElement('div');ov.className='modal';
  ov.innerHTML='<div class="sheet"><div class="mhead"><button class="mclose">'+I.x+'</button><span class="mtitle">'+esc(meta.name)+'</span></div>'+(isImg?'<img class="mimg" src="'+data+'">':'<div class="mph">'+I.file+'<span>پیش‌نمایش برای این فایل نیست.</span></div>')+'<a class="solid wide" href="'+data+'" download="'+esc(meta.name)+'">'+I.download+' دانلود</a></div>';
  ov.addEventListener('click',function(e){if(e.target===ov||e.target.closest('.mclose'))document.body.removeChild(ov);});
  document.body.appendChild(ov);
}

function exportData(){
  var files=S.files.map(function(f){return {id:f.id,name:f.name,type:f.type,size:f.size,date:f.date,data:localStorage.getItem('planner_file_'+f.id)||''};});
  var trades=S.trades.map(function(t){return Object.assign({},t,{img:t.hasImg?(localStorage.getItem('planner_trade_img_'+t.id)||''):''});});
  var dump={app:'planner',version:1,date:new Date().toISOString(),tasks:S.tasks,notes:S.notes,files:files,trades:trades};
  var blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='backup-planner-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
}
function importData(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||d.app!=='planner'){alert('این فایلِ بکاپِ این اپ نیست.');return;}
      if(!confirm('داده‌های فعلی با این بکاپ جایگزین بشه؟'))return;
      S.tasks=d.tasks||[];S.notes=d.notes||[];
      var metas=[];
      (d.files||[]).forEach(function(x){var id=x.id||uid();if(x.data){try{localStorage.setItem('planner_file_'+id,x.data);}catch(er){}}metas.push({id:id,name:x.name,type:x.type,size:x.size,date:x.date});});
      S.files=metas;
      var trs=[];
      (d.trades||[]).forEach(function(x){var id=x.id||uid();var img=x.img||'';if(img){try{localStorage.setItem('planner_trade_img_'+id,img);}catch(er){}}var c=Object.assign({},x);delete c.img;c.id=id;c.hasImg=!!img;trs.push(c);});
      S.trades=trs;
      save('planner_tasks',S.tasks);save('planner_notes',S.notes);save('planner_files',S.files);save('planner_trades',S.trades);
      S.tab='today';render();alert('بکاپ بازیابی شد.');
    }catch(err){alert('فایل خراب بود یا خونده نشد.');}
  };
  r.readAsText(f);
}

function onTradeImg(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;if(f.size>3145728){alert('تصویر بزرگ‌تر از ۳ مگابایته.');return;}var r=new FileReader();r.onload=function(){syncDraft();S.draft.imgData=r.result;S.draft.imgType=f.type;render();};r.readAsDataURL(f);}
function openImg(data,name){var ov=document.createElement('div');ov.className='modal';ov.innerHTML='<div class="sheet"><div class="mhead"><button class="mclose">'+I.x+'</button><span class="mtitle">'+esc(name||'تصویر')+'</span></div><img class="mimg" src="'+data+'"><a class="solid wide" href="'+data+'" download="'+esc(name||'image')+'">'+I.download+' دانلود</a></div>';ov.addEventListener('click',function(e){if(e.target===ov||e.target.closest('.mclose'))document.body.removeChild(ov);});document.body.appendChild(ov);}

document.getElementById('view').addEventListener('click',function(e){
  var jt=e.target.closest('[data-jtog]');if(jt){syncDraft();var fld=jt.getAttribute('data-jtog'),val=jt.getAttribute('data-val'),a=S.draft[fld]||[],ix=a.indexOf(val);if(ix>=0)a.splice(ix,1);else a.push(val);S.draft[fld]=a;render();return;}
  var js=e.target.closest('[data-jset]');if(js){syncDraft();S.draft[js.getAttribute('data-jset')]=js.getAttribute('data-val');render();return;}
  var str=e.target.closest('[data-jstar]');if(str){syncDraft();S.draft.discipline=+str.getAttribute('data-jstar');render();return;}
  var cse=e.target.closest('[data-cset]');if(cse){var ck=cse.getAttribute('data-cset');S.chk[ck]=!S.chk[ck];render();return;}
  var csl=e.target.closest('[data-csel]');if(csl){S.chk[csl.getAttribute('data-csel')]=csl.getAttribute('data-val');render();return;}
  var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(act==='addtask'){var i=document.getElementById('newtask'),v=i.value.trim();if(!v)return;S.tasks.push({id:uid(),text:v,done:false});save('planner_tasks',S.tasks);render();}
  else if(act==='toggle'){S.tasks=S.tasks.map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t;});save('planner_tasks',S.tasks);render();}
  else if(act==='deltask'){S.tasks=S.tasks.filter(function(t){return t.id!==id;});save('planner_tasks',S.tasks);render();}
  else if(act==='opennote'){S.editor=true;render();}
  else if(act==='cancelnote'){S.editor=false;render();}
  else if(act==='savenote'){var ti=document.getElementById('ntitle').value.trim(),bo=document.getElementById('nbody').value.trim();if(!ti&&!bo){S.editor=false;render();return;}S.notes.unshift({id:uid(),title:ti,body:bo,date:faDate({day:'numeric',month:'long',year:'numeric'})});save('planner_notes',S.notes);S.editor=false;render();}
  else if(act==='delnote'){S.notes=S.notes.filter(function(n){return n.id!==id;});save('planner_notes',S.notes);render();}
  else if(act==='pick'){document.getElementById('fileinput').click();}
  else if(act==='openfile'){openFile(id);}
  else if(act==='delfile'){e.stopPropagation();try{localStorage.removeItem('planner_file_'+id);}catch(x){}S.files=S.files.filter(function(f){return f.id!==id;});save('planner_files',S.files);render();}
  else if(act==='export'){exportData();}
  else if(act==='pickimport'){document.getElementById('importinput').click();}
  else if(act==='openjournal'){S.draft=blankDraft();S.jed=true;render();}
  else if(act==='openchk'){S.chk={};S.chkOpen=true;S.jed=false;S.editId=null;render();}
  else if(act==='cancelchk'){S.chkOpen=false;S.chk=null;render();}
  else if(act==='submitchk'){
    var c=S.chk,setup=[];
    if(c.bos)setup.push('bos');
    if(c.hunt_prev)setup.push('hunt_prev');
    if(c.hunt_liq)setup.push('hunt_liq');
    if(c.gap_daily)setup.push('gap1d');
    if(c.gap_hourly==='gap1h')setup.push('gap1h');else if(c.gap_hourly==='gap4h')setup.push('gap4h');else if(c.gap_hourly==='both'){setup.push('gap1h');setup.push('gap4h');}
    var nt=blankDraft();
    nt.id=uid();nt.date=faDate({day:'numeric',month:'long'});nt.dir=c.dir||'';nt.pd=c.pd||'';nt.setup=setup;nt.chk=Object.assign({},c);nt.status='pending';nt.hasImg=false;
    delete nt.imgData;delete nt.imgType;
    S.trades.unshift(nt);save('planner_trades',S.trades);
    S.chkOpen=false;S.chk=null;render();
  }
  else if(act==='completetrade'){var tt=S.trades.filter(function(x){return x.id===id;})[0];if(!tt)return;var dr=Object.assign(blankDraft(),tt);if(!Array.isArray(dr.setup))dr.setup=dr.setup?[dr.setup]:[];dr.imgData=tt.hasImg?(localStorage.getItem('planner_trade_img_'+id)||''):'';dr.imgType=tt.imgType||'';S.draft=dr;S.editId=id;S.jed=true;S.chkOpen=false;render();}
  else if(act==='canceltrade'){S.jed=false;S.draft=null;S.editId=null;render();}
  else if(act==='tradeimg'){syncDraft();document.getElementById('tradeimginput').click();}
  else if(act==='opentradeimg'){var im=localStorage.getItem('planner_trade_img_'+id);if(im)openImg(im,'اسکرین‌شات');}
  else if(act==='deltrade'){if(!confirm('این معامله حذف بشه؟'))return;try{localStorage.removeItem('planner_trade_img_'+id);}catch(x){}S.trades=S.trades.filter(function(t){return t.id!==id;});save('planner_trades',S.trades);render();}
  else if(act==='savetrade'){syncDraft();var d=S.draft;if(!d.symbol||!d.outcome){alert('حداقل نماد و نتیجه رو انتخاب کن.');return;}
    if(S.editId){
      var ei=S.trades.map(function(t){return t.id;}).indexOf(S.editId);
      if(ei>=0){var ex=S.trades[ei];if(d.imgData){try{localStorage.setItem('planner_trade_img_'+S.editId,d.imgData);}catch(er){}}
        S.trades[ei]=Object.assign({},ex,{symbol:d.symbol,dir:d.dir,setup:d.setup,setupother:d.setupother,pd:d.pd,setupdate:d.setupdate,setuptime:d.setuptime,session:d.session,entry:d.entry,sl:d.sl,tp:d.tp,outcome:d.outcome,risk:d.risk,r:d.r,pct:d.pct,pips:d.pips,amount:d.amount,balance:d.balance,plan:d.plan,emotion:d.emotion,broke:d.broke,discipline:d.discipline,mistake:d.mistake,lesson:d.lesson,note:d.note,chk:d.chk,status:'done',hasImg:d.imgData?true:!!ex.hasImg,imgType:d.imgType||ex.imgType});}
      S.editId=null;
    } else {
      var tid=uid();if(d.imgData){try{localStorage.setItem('planner_trade_img_'+tid,d.imgData);}catch(er){}}
      S.trades.unshift({id:tid,date:faDate({day:'numeric',month:'long'}),symbol:d.symbol,dir:d.dir,setup:d.setup,setupother:d.setupother,pd:d.pd,setupdate:d.setupdate,setuptime:d.setuptime,session:d.session,entry:d.entry,sl:d.sl,tp:d.tp,outcome:d.outcome,risk:d.risk,r:d.r,pct:d.pct,pips:d.pips,amount:d.amount,balance:d.balance,plan:d.plan,emotion:d.emotion,broke:d.broke,discipline:d.discipline,mistake:d.mistake,lesson:d.lesson,note:d.note,chk:d.chk,status:'done',hasImg:!!d.imgData,imgType:d.imgType});
    }
    save('planner_trades',S.trades);S.jed=false;S.draft=null;render();}
});
document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;syncDraft();S.tab=b.getAttribute('data-tab');S.editor=false;S.fmsg='';render();});

(function(){try{
  var icon="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%2315705A'/%3E%3Cpath d='M150 270 L225 345 L370 175' fill='none' stroke='%23fff' stroke-width='42' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E";
  var man={name:'برنامه‌ی من',short_name:'برنامه‌ی من',start_url:'.',display:'standalone',background_color:'#ECEFEA',theme_color:'#15705A',dir:'rtl',lang:'fa',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
  var b=new Blob([JSON.stringify(man)],{type:'application/manifest+json'});
  var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(b);document.head.appendChild(l);
}catch(e){}})();

setInterval(function(){if(S.tab==='today')render();},30000);
render();
</script>
